            // 從歌曲標題解析歌手和歌名
            function parseSongTitle(title) {
                console.log('🎵 Parsing title:', title);
                
                // 先移除括號內容（通常是 Official Music Video 等無關資訊）
                let cleanTitle = title
                    .replace(/\(歌[词詞]版\)/gi, '') // 移除 (歌词版)
                    .replace(/\[歌[词詞]版\]/gi, '') // 移除 [歌词版]
                    .replace(/\(official\s+video\)/gi, '') // 移除 (official video)
                    .replace(/\(official\s+music\s+video\)/gi, '') // 移除 (official music video)
                    .replace(/\[official\s+video\]/gi, '') // 移除 [official video]
                    .replace(/\[official\s+music\s+video\]/gi, '') // 移除 [official music video]
                    .replace(/\(Official.*?MV.*?\)/gi, '')
                    .replace(/\[Official.*?MV.*?\]/gi, '')
                    .replace(/\(MV\)/gi, '')
                    .replace(/\[MV\]/gi, '')
                    .replace(/Official\s+MV/gi, '')
                    .replace(/Music\s+Video/gi, '')
                    .replace(/\(Lyric.*?\)/gi, '')
                    .replace(/\[Lyric.*?\]/gi, '')
                    .replace(/\(HD\)/gi, '')
                    .replace(/\[HD\]/gi, '')
                    .replace(/\(4K\)/gi, '')
                    .replace(/\[4K\]/gi, '')
                    .replace(/\(.*?Ver.*?\)/gi, '')
                    .replace(/\[.*?Ver.*?\]/gi, '')
                    .trim();
                
                let artist = '';
                let track = cleanTitle;
                
                // 🔥 優先級 1：處理 - 分隔符（歌手 - 歌名）
                // 特別處理：如果有多個《》，優先使用 - 後面的《》內容
                // 例如：Our Times《我的少女时代》电影主題曲 -《小幸运》MV by 田馥甄
                if (cleanTitle.match(/\s[-–—]\s/)) {
                    const parts = cleanTitle.split(/\s[-–—]\s/);
                    
                    let artistPart = '';
                    let songPart = '';
                    
                    if (parts.length > 2) {
                        // 多個 -，最後一個是歌名
                        songPart = parts[parts.length - 1].trim();
                        artistPart = parts.slice(0, -1).join(' - ').trim();
                    } else {
                        // 只有一個 -，前面是歌手，後面是歌名
                        artistPart = parts[0].trim();
                        songPart = parts[1].trim();
                    }
                    
                    // 🔥 處理歌名部分：優先提取《》內容
                    const bookTitleMatch = songPart.match(/《(.+?)》/);
                    if (bookTitleMatch) {
                        track = bookTitleMatch[1].trim();
                        track = track.replace(/\s+/g, '');
                    } else {
                        const chineseTrackMatch = songPart.match(/([\u4e00-\u9fa5]+(?:\s*[\u4e00-\u9fa5]+)*)/);
                        if (chineseTrackMatch) {
                            track = chineseTrackMatch[1].trim();
                            track = track.replace(/\s+/g, '');
                        } else {
                            track = songPart;
                        }
                    }
                    
                    // 🔥 處理歌手部分：檢查是否有 by（by 後面是歌手）
                    const byMatch = songPart.match(/\s+by\s+(.+?)$/i);
                    if (byMatch) {
                        // by 後面是歌手
                        artist = byMatch[1].trim();
                        // 從歌手名提取中文
                        const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                        if (chineseArtistMatch) {
                            artist = chineseArtistMatch[1].trim();
                        }
                    } else {
                        // 沒有 by，從原本的歌手部分提取中文
                        const chineseArtistMatch = artistPart.match(/([\u4e00-\u9fa5]+)/);
                        if (chineseArtistMatch) {
                            artist = chineseArtistMatch[1].trim();
                        } else {
                            artist = artistPart;
                        }
                    }
                    
                    console.log('✅ 使用 - 規則解析 (歌手-歌名) - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                // 🔥 優先級 2: 處理《》符號
                // 如果有多個《》，選擇第一個
                const bookTitleMatch = cleanTitle.match(/(.+?)《(.+?)》/);
                if (bookTitleMatch) {
                    track = bookTitleMatch[2].trim();
                    track = track.replace(/\s+/g, '');
                    
                    let artistPart = bookTitleMatch[1].trim();
                    artistPart = artistPart.replace(/[-–—|\/\s]+$/, '').trim();
                    
                    // 檢查是否有 by（by 後面的內容在《》外面的情況較少，但還是處理）
                    // 檢查後續內容是否有 by
                    const restContent = cleanTitle.substring(cleanTitle.indexOf('》') + 1);
                    const byMatch = restContent.match(/\s+by\s+(.+?)$/i);
                    if (byMatch) {
                        artist = byMatch[1].trim();
                        const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                        if (chineseArtistMatch) {
                            artist = chineseArtistMatch[1].trim();
                        }
                    } else {
                        const chineseArtistMatch = artistPart.match(/([\u4e00-\u9fa5]+)/);
                        if (chineseArtistMatch) {
                            artist = chineseArtistMatch[1].trim();
                        } else {
                            artist = artistPart;
                        }
                    }
                    console.log('✅ 使用《》規則解析 (優先級2) - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                // 🔥 優先級 3：處理 Covered by（Covered by 後面是歌手名字）
                const coveredByMatch = cleanTitle.match(/(.+?)[\|｜]?\s*(?:Covered?\s+by|cover\s+by)\s+(.+?)(?:\(|$)/i);
                if (coveredByMatch) {
                    let songPart = coveredByMatch[1].trim();
                    let coverArtist = coveredByMatch[2].trim();
                    
                    // 從歌曲部分提取《》內容
                    const songBookTitleMatch = songPart.match(/《(.+?)》/);
                    if (songBookTitleMatch) {
                        track = songBookTitleMatch[1].trim();
                        track = track.replace(/\s+/g, '');
                    } else {
                        // 提取中文歌名
                        const chineseTrackMatch = songPart.match(/([\u4e00-\u9fa5]+(?:\s*[\u4e00-\u9fa5]+)*)/);
                        track = chineseTrackMatch ? chineseTrackMatch[1].trim().replace(/\s+/g, '') : songPart;
                    }
                    
                    // Covered by 後面是歌手名字
                    artist = coverArtist.replace(/^(MC|DJ|Mr\.|Ms\.)\s+/gi, '').trim();
                    const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                    if (chineseArtistMatch) {
                        artist = chineseArtistMatch[1].trim();
                    }
                    
                    console.log('✅ 使用 Covered by 規則解析 (優先級3) - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                // 規則 4: 處理「」符號
                const quoteMatch = cleanTitle.match(/(.+?)「(.+?)」/);
                if (quoteMatch) {
                    artist = quoteMatch[1].trim();
                    track = quoteMatch[2].trim();
                    track = track.replace(/\s+/g, '');
                    artist = artist.replace(/[-–—|\/\s]+$/, '').trim();
                    const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                    if (chineseArtistMatch) {
                        artist = chineseArtistMatch[1].trim();
                    }
                    console.log('✅ 使用「」規則解析 - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                // 規則 5: 使用 / 分隔
                if (cleanTitle.includes(' / ')) {
                    const parts = cleanTitle.split(' / ');
                    artist = parts[0].trim();
                    track = parts[1].trim();
                    track = track.replace(/\s+/g, '');
                    const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                    if (chineseArtistMatch) {
                        artist = chineseArtistMatch[1].trim();
                    }
                    console.log('✅ 使用 / 規則解析 - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                // 規則 6: 使用 | 分隔
                if (cleanTitle.includes(' | ')) {
                    const parts = cleanTitle.split(' | ');
                    artist = parts[0].trim();
                    track = parts[1].trim();
                    track = track.replace(/\s+/g, '');
                    const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                    if (chineseArtistMatch) {
                        artist = chineseArtistMatch[1].trim();
                    }
                    console.log('✅ 使用 | 規則解析 - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                // 規則 7: 使用【】分隔
                if (cleanTitle.includes('【') && cleanTitle.includes('】')) {
                    const match = cleanTitle.match(/(.+?)【(.+?)】/);
                    if (match) {
                        let beforeBracket = match[1].trim();
                        track = match[2].trim();
                        track = track.replace(/\s+/g, '');
                        
                        // 檢查【】後面是否有 by
                        const restContent = cleanTitle.substring(cleanTitle.indexOf('】') + 1);
                        const byMatch = restContent.match(/\s+by\s+(.+?)$/i);
                        if (byMatch) {
                            artist = byMatch[1].trim();
                            const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                            if (chineseArtistMatch) {
                                artist = chineseArtistMatch[1].trim();
                            }
                        } else {
                            const chineseArtistMatch = beforeBracket.match(/([\u4e00-\u9fa5]+)/);
                            if (chineseArtistMatch) {
                                artist = chineseArtistMatch[1].trim();
                            } else {
                                artist = beforeBracket;
                            }
                        }
                        console.log('✅ 使用【】規則解析 - Artist:', artist, 'Track:', track);
                        return { artist, track };
                    }
                }
                
                // 規則 8: 處理「歌名 歌手」格式（沒有分隔符）
                const chineseWords = cleanTitle.match(/[\u4e00-\u9fa5]+/g);
                if (chineseWords && chineseWords.length >= 2) {
                    track = chineseWords[0].trim();
                    artist = chineseWords[1].trim();
                    console.log('✅ 使用「歌名 歌手」規則解析 - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                // 智能猜測
                const words = cleanTitle.split(/\s+/);
                if (words.length >= 3) {
                    if (words[0].length <= 4) {
                        artist = words.slice(0, 2).join(' ').trim();
                        track = words.slice(2).join(' ').trim();
                    } else {
                        artist = words[0].trim();
                        track = words.slice(1).join(' ').trim();
                    }
                    const chineseArtistMatch = artist.match(/([\u4e00-\u9fa5]+)/);
                    if (chineseArtistMatch) {
                        artist = chineseArtistMatch[1].trim();
                    }
                    console.log('✅ 使用智能猜測 - Artist:', artist, 'Track:', track);
                    return { artist, track };
                }
                
                console.log('⚠️ 無法明確分割，使用完整標題作為歌名');
                return { artist: '', track: cleanTitle };
            }

            // 從 LRCLIB 獲取歌詞（改進版 - 支援 duration 精確匹配）
            async function fetchLyricsFromLRCLIB(artist, track, videoDuration = null) {
                try {
                    // 根據 LRCLIB API 文檔，/api/search 支援以下參數：
                    // - track_name (必填或與 q 二選一)
                    // - artist_name (選填)
                    // - album_name (選填)
                    // - q (必填或與 track_name 二選一) - 搜尋任何欄位
                    
                    let url;
                    
                    // 策略 1: 如果有歌手和歌名，使用精確搜尋
                    if (artist && track) {
                        url = `https://lrclib.net/api/search?track_name=${encodeURIComponent(track)}&artist_name=${encodeURIComponent(artist)}`;
                    } 
                    // 策略 2: 只有歌名，使用 track_name 參數
                    else if (track) {
                        url = `https://lrclib.net/api/search?track_name=${encodeURIComponent(track)}`;
                    }
                    // 策略 3: 使用 q 參數進行模糊搜尋
                    else {
                        return null;
                    }
                    
                    console.log('🔍 LRCLIB API URL:', url);
                    if (videoDuration) {
                        console.log('⏱️ Video duration:', videoDuration, 'seconds');
                    }
                    
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'User-Agent': 'KTV-System v1.0 (GitHub Copilot Generated)'
                        }
                    });
                    
                    if (!response.ok) {
                        console.log('❌ LRCLIB response not ok:', response.status);
                        return null;
                    }
                    
                    const data = await response.json();
                    console.log('📦 LRCLIB response:', data.length, 'results');
                    
                    // API 返回的是陣列，包含最多 20 個結果
                    if (data && Array.isArray(data) && data.length > 0) {
                        let bestResult = null;
                        
                        // 🔥 新策略：如果有影片時長，優先選擇時長匹配的（±2秒內）
                        if (videoDuration) {
                            const durationMatches = data.filter(r => {
                                if (r.duration) {
                                    const diff = Math.abs(r.duration - videoDuration);
                                    return diff <= 2; // ±2秒內
                                }
                                return false;
                            });
                            
                            if (durationMatches.length > 0) {
                                console.log('✅ Found', durationMatches.length, 'duration matches (±2s)');
                                // 在時長匹配的結果中，優先選擇有同步歌詞的
                                bestResult = durationMatches.find(r => r.syncedLyrics) || durationMatches[0];
                                console.log('🎯 Selected by duration match:', {
                                    id: bestResult.id,
                                    duration: bestResult.duration,
                                    videoDuration: videoDuration,
                                    diff: Math.abs(bestResult.duration - videoDuration)
                                });
                            } else {
                                console.log('⚠️ No exact duration match, using default strategy');
                            }
                        }
                        
                        // 如果沒有時長匹配，使用原本的策略
                        if (!bestResult) {
                            // 優先選擇有同步歌詞的結果
                            bestResult = data.find(r => r.syncedLyrics);
                            
                            // 如果沒有同步歌詞，取第一個有純文字歌詞的
                            if (!bestResult) {
                                bestResult = data.find(r => r.plainLyrics);
                            }
                            
                            // 如果都沒有，取第一個結果
                            if (!bestResult) {
                                bestResult = data[0];
                            }
                        }
                        
                        if (bestResult) {
                            // 優先返回同步歌詞（syncedLyrics）
                            if (bestResult.syncedLyrics) {
                                console.log('✅ Found synced lyrics!', {
                                    id: bestResult.id,
                                    trackName: bestResult.trackName,
                                    artistName: bestResult.artistName,
                                    duration: bestResult.duration
                                });
                                return bestResult.syncedLyrics;
                            } 
                            // 其次返回純文字歌詞（plainLyrics）
                            else if (bestResult.plainLyrics) {
                                console.log('⚠️ Only plain lyrics available', {
                                    id: bestResult.id,
                                    trackName: bestResult.trackName,
                                    artistName: bestResult.artistName
                                });
                                return bestResult.plainLyrics;
                            }
                            // 檢查是否為純音樂
                            else if (bestResult.instrumental) {
                                console.log('🎵 Track is instrumental (no lyrics)');
                                return null;
                            }
                        }
                    }
                    
                    console.log('❌ No lyrics found in LRCLIB');
                    return null;
                } catch (error) {
                    console.error('❌ LRCLIB error:', error);
                    return null;
                }
            }

            // 從 YouTube 描述或其他來源獲取歌詞（備用方案 - 使用 q 參數）
            async function fetchLyricsBackup(songName) {
                try {
                    // 嘗試從歌名中提取關鍵字
                    const cleanName = songName
                        .replace(/\(.*?\)/g, '')
                        .replace(/\[.*?\]/g, '')
                        .replace(/official|mv|video|audio|lyrics?/gi, '')
                        .trim();
                    
                    console.log('🔄 Trying backup search with q parameter:', cleanName);
                    
                    // 使用 LRCLIB 的 q 參數進行模糊搜尋（搜尋所有欄位）
                    const url = `https://lrclib.net/api/search?q=${encodeURIComponent(cleanName)}`;
                    const response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'User-Agent': 'KTV-System v1.0 (GitHub Copilot Generated)'
                        }
                    });
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data && Array.isArray(data) && data.length > 0) {
                            // 優先選擇有同步歌詞的結果
                            const result = data.find(r => r.syncedLyrics) || data.find(r => r.plainLyrics) || data[0];
                            
                            if (result) {
                                if (result.syncedLyrics) {
                                    console.log('✅ Found lyrics via backup search (q parameter)!');
                                    return result.syncedLyrics;
                                } else if (result.plainLyrics) {
                                    console.log('✅ Found plain lyrics via backup search!');
                                    return result.plainLyrics;
                                }
                            }
                        }
                    }
                    
                    return null;
                } catch (error) {
                    console.error('❌ Backup search error:', error);
                    return null;
                }
            }

            // 解析 LRC 格式歌詞
            function parseLRC(lrcText) {
                if (!lrcText) return [];
                
                const lines = lrcText.split('\n');
                const lyrics = [];
                
                for (const line of lines) {
                    // 匹配時間標籤 [mm:ss.xx] 或 [mm:ss]
                    const match = line.match(/\[(\d{2}):(\d{2})\.?(\d{2})?\](.*)/);
                    if (match) {
                        const minutes = parseInt(match[1]);
                        const seconds = parseInt(match[2]);
                        const centiseconds = match[3] ? parseInt(match[3]) : 0;
                        const text = match[4].trim();
                        
                        // 轉換為秒
                        const time = minutes * 60 + seconds + centiseconds / 100;
                        
                        if (text) {  // 只添加有文字的行
                            lyrics.push({ time, text });
                        }
                    }
                }
                
                // 按時間排序
                lyrics.sort((a, b) => a.time - b.time);
                
                console.log('📝 Parsed lyrics:', lyrics.length, 'lines');
                return lyrics;
            }

            // 檢查歌詞是否可用（靜默檢查，不顯示載入中）
            async function checkLyricsAvailability(songName) {
                try {
                    // 生成新的請求 ID
                    const requestId = ++AppState.lyrics.requestId;
                    console.log(`🔍 [Request ${requestId}] Checking lyrics availability for:`, songName);
                    
                    // 如果是同一首歌且還在載入中，直接返回現有的 Promise
                    if (AppState.lyrics.currentSongName === songName && AppState.lyrics.loadingPromise) {
                        console.log(`⏭️ [Request ${requestId}] Same song already loading, reusing existing promise`);
                        return AppState.lyrics.loadingPromise;
                    }
                    
                    // 更新當前歌曲名稱
                    AppState.lyrics.currentSongName = songName;
                    
                    const toggleBtn = AppState.domCache.get('toggleLyricsBtn');
                    const statusText = AppState.domCache.get('lyricsStatusText');
                    
                    // 解析歌名
                    const { artist, track } = parseSongTitle(songName);
                    
                    if (!track) {
                        console.log(`⚠️ [Request ${requestId}] Cannot parse song title, will try raw search`);
                        // 不要立即顯示找不到，繼續嘗試其他搜尋方式
                    }
                    
                    // 檢查是否已被新請求取代
                    if (requestId !== AppState.lyrics.requestId) {
                        console.log(`❌ [Request ${requestId}] Cancelled by newer request ${AppState.lyrics.requestId}`);
                        return false;
                    }
                    
                    // 準備多種搜尋關鍵字組合（優化：使用並行搜尋，可以增加更多組合）
                    const searchVariants = [];
                    
                    // 1. 原始的歌手 + 歌名（完整）- 最準確
                    if (artist && track) {
                        searchVariants.push({ artist, track, label: '歌手+完整歌名' });
                    }
                    
                    // 2. 只用完整歌名 - 第二準確
                    if (track) {
                        searchVariants.push({ artist: '', track, label: '只用完整歌名' });
                    }
                    
                    // 3. 如果沒有 track，使用原始歌名
                    if (!track) {
                        searchVariants.push({ artist: '', track: songName, label: '原始歌名' });
                    }
                    
                    // 4. 清理歌手名（移除 MC, DJ 等前綴）+ 完整歌名
                    if (artist && track) {
                        const cleanArtist = artist.replace(/^(MC|DJ|Mr\.|Ms\.)\s+/gi, '').trim();
                        if (cleanArtist && cleanArtist !== artist) {
                            searchVariants.push({ artist: cleanArtist, track, label: '清理後歌手+完整歌名' });
                        }
                    }
                    
                    // 5. 提取歌名中的中文部分 - 處理混合語言歌名
                    const searchTrack = track || songName;
                    const allChineseMatches = searchTrack.match(/[\u4e00-\u9fa5]+/g);
                    if (allChineseMatches && allChineseMatches.length > 0) {
                        const firstChinese = allChineseMatches[0];
                        if (firstChinese !== searchTrack && firstChinese.length >= 2) {
                            searchVariants.push({ artist: '', track: firstChinese, label: '第一個中文詞' });
                            if (artist) {
                                searchVariants.push({ artist, track: firstChinese, label: '歌手+第一個中文詞' });
                            }
                        }
                        
                        // 所有中文詞組合
                        if (allChineseMatches.length > 1) {
                            const allChinese = allChineseMatches.join('');
                            if (allChinese !== searchTrack) {
                                searchVariants.push({ artist: '', track: allChinese, label: '所有中文詞' });
                            }
                        }
                    }
                    
                    // 6. 提取歌名中的英文部分 - 處理混合語言歌名
                    const englishMatch = searchTrack.match(/([A-Za-z\s]+)/);
                    if (englishMatch && englishMatch[1].trim() && englishMatch[1].trim() !== searchTrack) {
                        const englishTrack = englishMatch[1].trim();
                        if (englishTrack.length >= 3) {
                            searchVariants.push({ artist: '', track: englishTrack, label: '英文部分' });
                            if (artist) {
                                searchVariants.push({ artist, track: englishTrack, label: '歌手+英文部分' });
                            }
                        }
                    }
                    
                    // 7. 提取第一個英文單詞
                    const firstEnglishMatch = searchTrack.match(/[A-Za-z]+/);
                    if (firstEnglishMatch && firstEnglishMatch[0].length >= 3) {
                        const firstEnglish = firstEnglishMatch[0];
                        if (firstEnglish !== searchTrack && !searchVariants.some(v => v.track === firstEnglish)) {
                            searchVariants.push({ artist: '', track: firstEnglish, label: '第一個英文詞' });
                        }
                    }
                    
                    // 8. 清理後的歌手 + 中文詞
                    if (artist && allChineseMatches && allChineseMatches.length > 0) {
                        const cleanArtist = artist.replace(/^(MC|DJ|Mr\.|Ms\.)\s+/gi, '').trim();
                        const firstChinese = allChineseMatches[0];
                        if (cleanArtist && cleanArtist !== artist && firstChinese !== searchTrack) {
                            searchVariants.push({ artist: cleanArtist, track: firstChinese, label: '清理後歌手+中文詞' });
                        }
                    }
                    
                    console.log(`🔍 checkLyricsAvailability: 準備搜尋，共 ${searchVariants.length} 種組合`);
                    
                    // 嘗試取得影片時長
                    let videoDuration = null;
                    if (AppState.player && AppState.player.getDuration) {
                        try {
                            videoDuration = AppState.player.getDuration();
                            if (videoDuration && videoDuration > 0) {
                                console.log('⏱️ 影片時長:', videoDuration, '秒');
                            } else {
                                videoDuration = null;
                            }
                        } catch (e) {
                            console.log('⚠️ 無法取得影片時長');
                        }
                    }
                    
                    // 🚀 並行搜尋策略：同時發送所有請求，取最快返回的結果
                    let lrcText = null;
                    
                    try {
                        // 創建所有搜尋 Promise，傳入影片時長
                        const searchPromises = searchVariants.map(variant => 
                            fetchLyricsFromLRCLIB(variant.artist, variant.track, videoDuration)
                                .then(result => {
                                    if (result) {
                                        console.log(`✅ 找到歌詞！使用: ${variant.label}`);
                                        return { result, variant };
                                    }
                                    return null;
                                })
                                .catch(err => {
                                    console.log(`❌ 搜尋失敗 (${variant.label}):`, err.message);
                                    return null;
                                })
                        );
                        
                        // 等待第一個成功的結果（或全部失敗）
                        const results = await Promise.all(searchPromises);
                        
                        // 找到第一個非空結果
                        const successResult = results.find(r => r && r.result);
                        if (successResult) {
                            lrcText = successResult.result;
                        }
                    } catch (error) {
                        console.error('❌ 並行搜尋出錯:', error);
                    }
                    
                    // 如果並行搜尋都失敗，最後嘗試用完整清理後標題搜尋
                    if (!lrcText) {
                        console.log(`🔄 [Request ${requestId}] 所有組合都失敗，最後嘗試用完整清理後標題搜尋...`);
                        
                        // 檢查是否已被新請求取代
                        if (requestId !== AppState.lyrics.requestId) {
                            console.log(`❌ [Request ${requestId}] Cancelled before backup search`);
                            return false;
                        }
                        
                        // 先用解析後的 track（如果有的話）
                        if (track && track.length >= 2) {
                            console.log(`🔍 [Request ${requestId}] 使用解析後的 track:`, track);
                            lrcText = await fetchLyricsFromLRCLIB('', track, videoDuration);
                            
                            // 檢查是否已被新請求取代
                            if (requestId !== AppState.lyrics.requestId) {
                                console.log(`❌ [Request ${requestId}] Cancelled after track search`);
                                return false;
                            }
                        }
                        
                        // 如果還是找不到，用模糊搜尋（q 參數）
                        if (!lrcText) {
                            console.log(`🔄 [Request ${requestId}] 最後使用模糊搜尋（q 參數）...`);
                            lrcText = await fetchLyricsBackup(songName);
                            
                            // 檢查是否已被新請求取代
                            if (requestId !== AppState.lyrics.requestId) {
                                console.log(`❌ [Request ${requestId}] Cancelled after backup search`);
                                return false;
                            }
                        }
                    }
                    
                    // ⚠️ 清除 currentSongName 鎖，允許後續請求
                    AppState.lyrics.currentSongName = '';
                    
                    if (!lrcText) {
                        console.log(`❌ [Request ${requestId}] No lyrics found`);
                        // 找不到歌詞，顯示提示，但保持按鈕可點擊讓使用者可再嘗試
                        if (toggleBtn) {
                            toggleBtn.disabled = false;
                            toggleBtn.style.opacity = '1';
                            toggleBtn.style.cursor = 'pointer';
                        }
                        if (statusText) {
                            statusText.style.display = 'block';
                        }
                        return false;
                    } else {
                        console.log(`✅ [Request ${requestId}] Lyrics found!`);
                        // 找到歌詞，啟用按鈕並隱藏提示
                        if (toggleBtn) {
                            toggleBtn.disabled = false;
                            toggleBtn.style.opacity = '1';
                            toggleBtn.style.cursor = 'pointer';
                        }
                        if (statusText) {
                            statusText.style.display = 'none';
                        }
                        return true;
                    }
                } catch (error) {
                    console.error(`❌ [Request ${requestId}] Error checking lyrics:`, error);
                    
                    // ⚠️ 清除 currentSongName 鎖
                    AppState.lyrics.currentSongName = '';
                    
                    const toggleBtn = AppState.domCache.get('toggleLyricsBtn');
                    const statusText = AppState.domCache.get('lyricsStatusText');
                    if (toggleBtn) {
                        toggleBtn.disabled = false; // 保持可點擊
                        toggleBtn.style.opacity = '1';
                        toggleBtn.style.cursor = 'pointer';
                    }
                    if (statusText) {
                        statusText.style.display = 'block';
                    }
                    return false;
                }
            }

            // 載入歌詞
            async function loadLyrics(songName) {
                try {
                    // 生成新的請求 ID
                    const requestId = ++AppState.lyrics.requestId;
                    console.log(`🎵 [Load Request ${requestId}] Loading lyrics for:`, songName);
                    
                    // 如果是同一首歌且還在載入中，直接返回現有的 Promise
                    if (AppState.lyrics.currentSongName === songName && AppState.lyrics.loadingPromise) {
                        console.log(`⏭️ [Load Request ${requestId}] Same song already loading, reusing existing promise`);
                        return AppState.lyrics.loadingPromise;
                    }
                    
                    // 更新當前歌曲名稱
                    AppState.lyrics.currentSongName = songName;
                    
                    const lyricsContainer = AppState.domCache.get('lyricsContainer');
                    const toggleBtn = AppState.domCache.get('toggleLyricsBtn');
                    const statusText = AppState.domCache.get('lyricsStatusText');
                    
                    // 重置按鈕狀態和提示文字
                    if (toggleBtn) {
                        toggleBtn.disabled = false;
                        toggleBtn.style.opacity = '1';
                        toggleBtn.style.cursor = 'pointer';
                    }
                    if (statusText) {
                        statusText.style.display = 'none';
                    }
                    
                    if (!lyricsContainer) {
                        console.error(`❌ [Load Request ${requestId}] Lyrics container not found`);
                        AppState.lyrics.currentSongName = '';
                        return;
                    }
                    
                    // 顯示載入中
                    lyricsContainer.innerHTML = '<div class="lyrics-loading"><span class="loader"></span><br>正在載入歌詞...</div>';
                    
                    // 檢查是否已被新請求取代
                    if (requestId !== AppState.lyrics.requestId) {
                        console.log(`❌ [Load Request ${requestId}] Cancelled after showing loading`);
                        return;
                    }
                    
                    // 解析歌名
                    const { artist, track } = parseSongTitle(songName);
                    
                    if (!track) {
                        console.log(`❌ [Load Request ${requestId}] Cannot parse song title`);
                        // 不關閉 AppState.lyrics.enabled，只是清空顯示
                        const toggleBtn = AppState.domCache.get('toggleLyricsBtn');
                        if (toggleBtn) {
                            toggleBtn.textContent = '🎤 顯示歌詞';
                            toggleBtn.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                            toggleBtn.disabled = true;
                            toggleBtn.style.opacity = '0.5';
                            toggleBtn.style.cursor = 'not-allowed';
                        }
                        lyricsContainer.innerHTML = '';
                        AppState.lyrics.currentSongName = '';
                        return;
                    }
                    
                    // 檢查是否已被新請求取代
                    if (requestId !== AppState.lyrics.requestId) {
                        console.log(`❌ [Load Request ${requestId}] Cancelled after parsing`);
                        return;
                    }
                    
                    // 準備多種搜尋關鍵字組合（優化：使用並行搜尋，可以增加更多組合）
                    const searchVariants = [];
                    
                    // 1. 原始的歌手 + 歌名（完整）- 最準確
                    if (artist && track) {
                        searchVariants.push({ artist, track, label: '歌手+完整歌名' });
                    }
                    
                    // 2. 只用完整歌名 - 第二準確
                    if (track) {
                        searchVariants.push({ artist: '', track, label: '只用完整歌名' });
                    }
                    
                    // 3. 清理歌手名（移除 MC, DJ 等前綴）+ 完整歌名
                    if (artist) {
                        const cleanArtist = artist.replace(/^(MC|DJ|Mr\.|Ms\.)\s+/gi, '').trim();
                        if (cleanArtist && cleanArtist !== artist) {
                            searchVariants.push({ artist: cleanArtist, track, label: '清理後歌手+完整歌名' });
                        }
                    }
                    
                    // 4. 提取歌名中的中文部分 - 處理混合語言歌名
                    const allChineseMatches = track.match(/[\u4e00-\u9fa5]+/g);
                    if (allChineseMatches && allChineseMatches.length > 0) {
                        const firstChinese = allChineseMatches[0];
                        if (firstChinese !== track && firstChinese.length >= 2) {
                            searchVariants.push({ artist: '', track: firstChinese, label: '第一個中文詞' });
                            if (artist) {
                                searchVariants.push({ artist, track: firstChinese, label: '歌手+第一個中文詞' });
                            }
                        }
                        
                        // 所有中文詞組合
                        if (allChineseMatches.length > 1) {
                            const allChinese = allChineseMatches.join('');
                            if (allChinese !== track) {
                                searchVariants.push({ artist: '', track: allChinese, label: '所有中文詞' });
                            }
                        }
                    }
                    
                    // 5. 提取歌名中的英文部分 - 處理混合語言歌名
                    const englishMatch = track.match(/([A-Za-z\s]+)/);
                    if (englishMatch && englishMatch[1].trim() && englishMatch[1].trim() !== track) {
                        const englishTrack = englishMatch[1].trim();
                        if (englishTrack.length >= 3) {
                            searchVariants.push({ artist: '', track: englishTrack, label: '英文部分' });
                            if (artist) {
                                searchVariants.push({ artist, track: englishTrack, label: '歌手+英文部分' });
                            }
                        }
                    }
                    
                    // 6. 提取第一個英文單詞
                    const firstEnglishMatch = track.match(/[A-Za-z]+/);
                    if (firstEnglishMatch && firstEnglishMatch[0].length >= 3) {
                        const firstEnglish = firstEnglishMatch[0];
                        if (firstEnglish !== track && !searchVariants.some(v => v.track === firstEnglish)) {
                            searchVariants.push({ artist: '', track: firstEnglish, label: '第一個英文詞' });
                        }
                    }
                    
                    // 7. 清理後的歌手 + 中文詞
                    if (artist && allChineseMatches && allChineseMatches.length > 0) {
                        const cleanArtist = artist.replace(/^(MC|DJ|Mr\.|Ms\.)\s+/gi, '').trim();
                        const firstChinese = allChineseMatches[0];
                        if (cleanArtist && cleanArtist !== artist && firstChinese !== track) {
                            searchVariants.push({ artist: cleanArtist, track: firstChinese, label: '清理後歌手+中文詞' });
                        }
                    }
                    
                    console.log(`🔍 [Load Request ${requestId}] 準備搜尋，共 ${searchVariants.length} 種組合`);
                    
                    // 檢查是否已被新請求取代
                    if (requestId !== AppState.lyrics.requestId) {
                        console.log(`❌ [Load Request ${requestId}] Cancelled before search start`);
                        return;
                    }
                    
                    // 嘗試取得影片時長
                    let videoDuration = null;
                    if (AppState.player && AppState.player.getDuration) {
                        try {
                            videoDuration = AppState.player.getDuration();
                            if (videoDuration && videoDuration > 0) {
                                console.log(`⏱️ [Load Request ${requestId}] 影片時長:`, videoDuration, '秒');
                            } else {
                                videoDuration = null;
                            }
                        } catch (e) {
                            console.log(`⚠️ [Load Request ${requestId}] 無法取得影片時長`);
                        }
                    }
                    
                    // 🚀 並行搜尋策略：同時發送所有請求，取最快返回的結果
                    let lrcText = null;
                    
                    try {
                        // 創建所有搜尋 Promise，傳入影片時長
                        const searchPromises = searchVariants.map(variant => 
                            fetchLyricsFromLRCLIB(variant.artist, variant.track, videoDuration)
                                .then(result => {
                                    // 檢查是否已被新請求取代
                                    if (requestId !== AppState.lyrics.requestId) {
                                        console.log(`⏭️ [Load Request ${requestId}] Search result ignored (cancelled)`);
                                        return { result: null, variant, cancelled: true };
                                    }
                                    
                                    if (result) {
                                        console.log(`✅ [Load Request ${requestId}] 成功: ${variant.label}`);
                                    } else {
                                        console.log(`❌ [Load Request ${requestId}] 失敗: ${variant.label}`);
                                    }
                                    return { result, variant };
                                })
                        );
                        
                        // 等待所有結果
                        const results = await Promise.all(searchPromises);
                        
                        // 再次檢查是否已被新請求取代
                        if (requestId !== AppState.lyrics.requestId) {
                            console.log(`❌ [Load Request ${requestId}] Cancelled after parallel search`);
                            return;
                        }
                        
                        // 找到第一個非空結果
                        const successResult = results.find(r => r && r.result && !r.cancelled);
                        if (successResult) {
                            lrcText = successResult.result;
                        }
                    } catch (error) {
                        console.error(`❌ [Load Request ${requestId}] 並行搜尋出錯:`, error);
                    }
                    
                    // 如果並行搜尋都失敗，最後嘗試用完整清理後標題搜尋
                    if (!lrcText) {
                        console.log(`🔄 [Load Request ${requestId}] 所有組合都失敗，最後嘗試用完整清理後標題搜尋...`);
                        
                        // 檢查是否已被新請求取代
                        if (requestId !== AppState.lyrics.requestId) {
                            console.log(`❌ [Load Request ${requestId}] Cancelled before backup search`);
                            return;
                        }
                        
                        // 先用解析後的 track（如果有的話）
                        if (track && track.length >= 2) {
                            console.log(`🔍 [Load Request ${requestId}] 使用解析後的 track:`, track);
                            lrcText = await fetchLyricsFromLRCLIB('', track, videoDuration);
                            
                            // 檢查是否已被新請求取代
                            if (requestId !== AppState.lyrics.requestId) {
                                console.log(`❌ [Load Request ${requestId}] Cancelled after track search`);
                                return;
                            }
                        }
                        
                        // 如果還是找不到，用模糊搜尋（q 參數）
                        if (!lrcText) {
                            console.log(`🔄 [Load Request ${requestId}] 最後使用模糊搜尋（q 參數）...`);
                            lrcText = await fetchLyricsBackup(songName);
                            
                            // 檢查是否已被新請求取代
                            if (requestId !== AppState.lyrics.requestId) {
                                console.log(`❌ [Load Request ${requestId}] Cancelled after backup search`);
                                return;
                            }
                        }
                    }
                    
                    // 🔥 最終檢查：確保這是最新請求（只在顯示結果前檢查一次）
                    if (requestId !== AppState.lyrics.requestId) {
                        console.log(`❌ [Load Request ${requestId}] 最終檢查失敗，已被新請求取代`);
                        return;
                    }
                    
                    if (!lrcText) {
                        console.log(`❌ [Load Request ${requestId}] No lyrics found after all attempts`);
                        // 找不到歌詞，顯示 1 秒後自動消失
                        if (toggleBtn) {
                            toggleBtn.disabled = true;
                            toggleBtn.style.opacity = '0.5';
                            toggleBtn.style.cursor = 'not-allowed';
                        }
                        if (statusText) {
                            statusText.style.display = 'block';
                        }
                        
                        // 🔥 顯示「找不到歌詞」提示，1 秒後自動清除
                        lyricsContainer.innerHTML = '<div class="no-lyrics">找不到歌詞</div>';
                        
                        // 清空歌詞並更新完整歌詞顯示
                        AppState.lyrics.current = [];
                        updateFullLyricsDisplay(); // 立即更新完整歌詞區塊
                        
                        setTimeout(() => {
                            if (lyricsContainer) {
                                lyricsContainer.innerHTML = '';
                            }
                        }, 1000); // 1 秒後清除浮動歌詞
                        
                        AppState.lyrics.currentSongName = '';
                        return;
                    }
                    
                    // 找到歌詞，隱藏提示文字
                    if (statusText) {
                        statusText.style.display = 'none';
                    }
                    
                    // 解析歌詞
                    AppState.lyrics.current = parseLRC(lrcText);
                    AppState.lyrics.currentSongName = '';
                    console.log(`✅ [Load Request ${requestId}] Parsed lyrics, count:`, AppState.lyrics.current.length);
                    
                    if (AppState.lyrics.current.length === 0) {
                        // 如果是純文字歌詞（沒有時間軸）
                        console.log('⚠️ Plain text lyrics without timestamps');
                        lyricsContainer.innerHTML = `<div class="lyrics-line active">${lrcText.replace(/\n/g, '<br>')}</div>`;
                        return;
                    }
                    
                    // 檢查第一句歌詞時間是否超過 10 秒，如果是，插入倒數提醒
                    if (AppState.lyrics.current.length > 0 && AppState.lyrics.current[0].time > 10) {
                        const firstLyricTime = AppState.lyrics.current[0].time;
                        // 倒數點在第一句歌詞前 2.7 秒出現（實際顯示時會提早 0.5 秒，所以總共提早 3.2 秒）
                        const countdownTime = firstLyricTime - 2.7;
                        const countdownLyric = {
                            time: countdownTime,
                            text: '●●●',
                            isCountdown: true  // 標記這是倒數提醒
                        };
                        // 插入到第一句歌詞之前
                        AppState.lyrics.current.unshift(countdownLyric);
                        
                        // 第一句歌詞時間不變，保持原本時間
                        // 這樣倒數點會在 firstLyricTime - 2.7 顯示
                        // 第一句歌詞會在 firstLyricTime 顯示
                        // 它們不會同時顯示，而是倒數點先出現2.7秒，然後第一句歌詞出現
                        
                        console.log('✅ 插入倒數提醒歌詞，時間:', countdownTime);
                        console.log('✅ 第一句歌詞時間:', AppState.lyrics.current[1].time);
                    }
                    
                    console.log('📝 Calling displayLyrics()');
                    // 顯示歌詞
                    displayLyrics();
                    
                    console.log('📝 Calling updateFullLyricsDisplay()');
                    // 立即顯示完整歌詞
                    updateFullLyricsDisplay();
                    
                    // 只有在影片正在播放時才開始同步
                    if (AppState.player && AppState.player.getPlayerState && AppState.player.getPlayerState() === YT.PlayerState.PLAYING) {
                        console.log('▶️ Video is playing, starting lyrics sync');
                        startLyricsSync();
                    } else {
                        console.log('⏸️ Video not playing, skipping lyrics sync');
                    }
                } catch (error) {
                    console.error('❌ Error loading lyrics:', error);
                    const lyricsContainer = AppState.domCache.get('lyricsContainer');
                    const fullLyricsContainer = AppState.domCache.get('fullLyricsContainer');
                    
                    // 不關閉 AppState.lyrics.enabled，保持歌詞功能開啟
                    // 🔥 顯示「找不到歌詞」提示，1 秒後自動清除
                    if (lyricsContainer) {
                        lyricsContainer.innerHTML = '<div class="no-lyrics">找不到歌詞</div>';
                        setTimeout(() => {
                            lyricsContainer.innerHTML = '';
                        }, 1000);
                    }
                    if (fullLyricsContainer) {
                        fullLyricsContainer.innerHTML = '<div class="no-lyrics">找不到歌詞</div>';
                        setTimeout(() => {
                            fullLyricsContainer.innerHTML = '';
                        }, 1000);
                    }
                }
            }

            // 顯示歌詞
            function displayLyrics() {
                const lyricsContainer = AppState.domCache.get('lyricsContainer');
                
                if (AppState.lyrics.current.length === 0) {
                    lyricsContainer.innerHTML = '';
                    return;
                }
                
                // 顯示歌詞 - 倒數點和第一句歌詞分開但視覺上組合
                let html = '';
                let hasCountdown = false;
                let countdownIndex = -1;
                let firstLyricIndex = -1;
                
                // 找到倒數和第一句歌詞的索引
                AppState.lyrics.current.forEach((line, index) => {
                    if (line.isCountdown) {
                        hasCountdown = true;
                        countdownIndex = index;
                    } else if (firstLyricIndex === -1) {
                        firstLyricIndex = index;
                    }
                });
                
                // 生成 HTML
                AppState.lyrics.current.forEach((line, index) => {
                    if (line.isCountdown) {
                        // 倒數點單獨一行
                        html += `<div class="lyrics-line lyrics-countdown" data-index="${index}" data-time="${line.time}">
                            <span class="countdown-dot dot-1">●</span>
                            <span class="countdown-dot dot-2">●</span>
                            <span class="countdown-dot dot-3">●</span>
                        </div>`;
                        console.log('🔵 Generated countdown HTML at index:', index, 'time:', line.time);
                    } else if (hasCountdown && index === firstLyricIndex) {
                        // 第一句歌詞（有倒數時添加特殊 class）
                        html += `<div class="lyrics-line first-lyric-with-countdown" data-index="${index}" data-time="${line.time}">${line.text}</div>`;
                        console.log('🔵 Generated first lyric HTML at index:', index, 'time:', line.time);
                    } else {
                        // 其他歌詞
                        html += `<div class="lyrics-line" data-index="${index}" data-time="${line.time}">${line.text}</div>`;
                    }
                });
                
                lyricsContainer.innerHTML = html;
            }

            // 更新完整歌詞顯示
            // 智能處理歌詞換行（手機版優化）
            function formatLyricsForDisplay(text) {
                // 如果歌詞很短（8個字以內），直接返回
                if (text.length <= 8) {
                    return text;
                }
                
                // 檢查是否有空格（英文歌詞或中英混合）
                if (text.includes(' ')) {
                    const words = text.split(' ');
                    
                    // 如果只有兩個單詞，用空格分隔即可
                    if (words.length === 2) {
                        return text;
                    }
                    
                    // 多個單詞時，嘗試平均分成兩行
                    const midPoint = Math.ceil(words.length / 2);
                    const firstLine = words.slice(0, midPoint).join(' ');
                    const secondLine = words.slice(midPoint).join(' ');
                    
                    // 使用 <br> 換行
                    return `${firstLine}<br>${secondLine}`;
                }
                
                // 純中文歌詞處理
                // 如果超過 12 個字，嘗試智能分行
                if (text.length > 12) {
                    // 嘗試在標點符號處分行
                    const punctuations = ['，', '、', '。', '！', '？', '；', ','];
                    for (let punct of punctuations) {
                        if (text.includes(punct)) {
                            const parts = text.split(punct);
                            if (parts.length === 2 && parts[0].length >= 4 && parts[1].length >= 2) {
                                // 保留標點符號在第一行末尾
                                return `${parts[0]}${punct}<br>${parts[1]}`;
                            }
                        }
                    }
                    
                    // 如果沒有標點，按字數平均分配
                    // 避免最後一行只有 1-2 個字
                    const midPoint = Math.ceil(text.length / 2);
                    
                    // 微調分割點，避免分割在奇怪的位置
                    let splitPoint = midPoint;
                    
                    // 如果第二行會少於 3 個字，調整分割點
                    if (text.length - midPoint < 3) {
                        splitPoint = text.length - 3;
                    }
                    
                    const firstLine = text.substring(0, splitPoint);
                    const secondLine = text.substring(splitPoint);
                    
                    return `${firstLine}<br>${secondLine}`;
                }
                
                // 8-12 個字之間，如果超過 10 個字也可以考慮分行
                if (text.length > 10) {
                    // 嘗試在中間位置分行，確保兩行字數接近
                    const midPoint = Math.ceil(text.length / 2);
                    const firstLine = text.substring(0, midPoint);
                    const secondLine = text.substring(midPoint);
                    
                    // 確保第二行至少有 3 個字
                    if (secondLine.length >= 3) {
                        return `${firstLine}<br>${secondLine}`;
                    }
                }
                
                // 其他情況直接返回原文
                return text;
            }

            function updateFullLyricsDisplay() {
                const fullLyricsSection = AppState.domCache.get('fullLyricsSection');
                const fullLyricsContainer = AppState.domCache.get('fullLyricsContainer');
                
                if (!fullLyricsContainer) {
                    console.log('⚠️ fullLyricsContainer not found');
                    return;
                }
                
                console.log('🔄 updateFullLyricsDisplay called, lyrics count:', AppState.lyrics.current.length, 'enabled:', AppState.lyrics.enabled);
                
                // 如果有歌詞且歌詞功能開啟，顯示完整歌詞區塊
                if (AppState.lyrics.current.length > 0 && AppState.lyrics.enabled) {
                    fullLyricsSection.style.display = 'block';
                    
                    // 生成完整歌詞 HTML（排除倒數點）
                    let html = '';
                    AppState.lyrics.current.forEach((line, index) => {
                        if (!line.isCountdown) {
                            const classList = [];
                            
                            // 根據當前播放位置設置樣式
                            if (AppState.lyrics.currentIndex >= 0) {
                                // 如果正在播放，高亮當前行
                                if (index === AppState.lyrics.currentIndex) {
                                    classList.push('current');
                                } else if (index < AppState.lyrics.currentIndex) {
                                    classList.push('past');
                                } else {
                                    classList.push('future');
                                }
                            } else {
                                // 如果沒有播放，所有歌詞都顯示為 future（未來）樣式
                                classList.push('future');
                            }
                            
                            // 使用智能換行處理歌詞
                            const formattedText = formatLyricsForDisplay(line.text);
                            html += `<div class="full-lyric-line ${classList.join(' ')}" data-index="${index}">${formattedText}</div>`;
                        }
                    });
                    
                    fullLyricsContainer.innerHTML = html || '<div class="no-lyrics">目前沒有歌詞</div>';
                    console.log('✅ Full lyrics displayed, HTML length:', html.length);
                } else {
                    console.log('⚠️ Not displaying full lyrics - count:', AppState.lyrics.current.length, 'enabled:', AppState.lyrics.enabled);
                    fullLyricsSection.style.display = 'none';
                    fullLyricsContainer.innerHTML = '<div class="no-lyrics">目前沒有歌詞</div>';
                }
            }

            // 開始歌詞同步 - 使用 requestAnimationFrame 優化效能
            function startLyricsSync() {
                // 清除舊的定時器
                if (AppState.lyrics.updateInterval) {
                    clearInterval(AppState.lyrics.updateInterval);
                }
                
                // 改為 250ms 更新一次（從 100ms 優化）
                AppState.lyrics.updateInterval = setInterval(updateLyricsHighlight, 250);
                console.log('🎤 Lyrics sync started');
            }

            // 停止歌詞同步
            function stopLyricsSync() {
                if (AppState.lyrics.updateInterval) {
                    clearInterval(AppState.lyrics.updateInterval);
                    AppState.lyrics.updateInterval = null;
                }
                console.log('⏸️ Lyrics sync stopped');
            }

            // 更新歌詞高亮
            function updateLyricsHighlight() {
                if (!AppState.player || !AppState.player.getCurrentTime || AppState.lyrics.current.length === 0) {
                    return;
                }
                
                // 🔥 關鍵修改：如果有主裝置且自己不是主裝置，不執行本地歌詞更新
                // 完全依賴 Firebase 同步的歌詞進度
                if (AppState.lyricsSync.hasMasterDevice && !AppState.lyricsSync.isMasterDevice) {
                    // 有其他主裝置存在，停止本地更新，完全跟隨主裝置
                    return;
                }
                
                const currentTime = AppState.player.getCurrentTime();
                const ADVANCE_TIME = 0.5; // 歌詞提早 0.5 秒顯示
                const adjustedTime = currentTime + ADVANCE_TIME;
                
                // 找到當前應該高亮的歌詞索引（使用提早的時間）
                // 從前往後找第一個時間已到的歌詞
                let newIndex = -1;
                for (let i = AppState.lyrics.current.length - 1; i >= 0; i--) {
                    if (adjustedTime >= AppState.lyrics.current[i].time) {
                        newIndex = i;
                        break;
                    }
                }
                
                // 特殊處理：如果是倒數點（index 0），檢查是否應該同時顯示第一句歌詞
                if (newIndex === 0 && AppState.lyrics.current[0].isCountdown && AppState.lyrics.current.length > 1) {
                    // 如果第一句歌詞的時間也到了，優先顯示倒數點
                    // （倒數點會比第一句歌詞早0.01秒，所以倒數點會先被匹配到）
                }
                
                // Debug: 每次更新都顯示（只在前 15 秒）
                if (currentTime < 15) {
                    console.log('🕐 Update - Time:', currentTime.toFixed(2), 'Adjusted:', adjustedTime.toFixed(2), 'newIndex:', newIndex, 'currentIndex:', AppState.lyrics.currentIndex, 'First lyric time:', AppState.lyrics.current[0]?.time.toFixed(2));
                }
                
                // 如果索引沒變，不需要更新
                if (newIndex === AppState.lyrics.currentIndex) {
                    return;
                }
                
                AppState.lyrics.currentIndex = newIndex;
                
                console.log('📍 Index changed to:', newIndex, 'Is countdown?', AppState.lyrics.current[newIndex]?.isCountdown);
                
                // 更新所有歌詞行的樣式
                const lyricsLines = document.querySelectorAll('.lyrics-line');
                console.log('📝 Total lyrics lines in DOM:', lyricsLines.length);
                
                lyricsLines.forEach((line, index) => {
                    line.classList.remove('active', 'past', 'future');
                    
                    if (index === AppState.lyrics.currentIndex) {
                        line.classList.add('active');
                        if (line.classList.contains('lyrics-countdown')) {
                            console.log('🟢 Countdown active at index:', index);
                        }
                        // 倒數點的動畫由 CSS 自動處理，不需要 JavaScript
                    } else if (index === AppState.lyrics.currentIndex + 1 && line.classList.contains('first-lyric-with-countdown')) {
                        // 如果當前是倒數點，同時顯示第一句歌詞
                        line.classList.add('active');
                        console.log('🟢 First lyric also active at index:', index);
                    } else if (index < AppState.lyrics.currentIndex) {
                        line.classList.add('past');
                    } else {
                        line.classList.add('future');
                    }
                });
                
                // 更新完整歌詞顯示
                updateFullLyricsDisplay();
            }

            // 從 YouTube API 獲取影片標題
            async function getVideoTitle(videoId) {
                console.log('🎵 Fetching title for video ID:', videoId);
                
                // 驗證 Video ID
                if (!videoId || videoId.length !== 11) {
                    console.error('❌ Invalid video ID:', videoId);
                    return `YouTube 影片 (無效 ID)`;
                }
                
                // 方法 1: 使用 YouTube Data API v3（最可靠）
                if (YOUTUBE_API_KEY && YOUTUBE_API_KEY !== "YOUR-API-KEY") {
                    try {
                        // 使用 snippet 部分獲取標題
                        const apiUrl = `https://www.googleapis.com/youtube/v3/videos?part=snippet&id=${videoId}&key=${YOUTUBE_API_KEY}`;
                        console.log('🔍 Trying YouTube API v3...');
                        console.log('📡 API URL:', apiUrl);
                        
                        const response = await fetch(apiUrl);
                        console.log('📥 API Response status:', response.status);
                        
                        if (response.ok) {
                            const data = await response.json();
                            console.log('📦 API Response data:', data);
                            
                            if (data.items && data.items.length > 0) {
                                const title = data.items[0].snippet.title;
                                console.log('✅ Successfully fetched from YouTube API:', title);
                                return title;
                            } else {
                                console.warn('⚠️ No items found in API response');
                            }
                        } else {
                            const errorText = await response.text();
                            console.error('❌ YouTube API error:', response.status, errorText);
                        }
                    } catch (error) {
                        console.error('❌ YouTube API failed:', error.message);
                        console.error('Error details:', error);
                    }
                }
                
                // 方法 2: 使用 oEmbed API（備用）
                try {
                    const oembedUrl = `https://www.youtube.com/oembed?url=https://www.youtube.com/watch?v=${videoId}&format=json`;
                    console.log('🔍 Trying oEmbed API...');
                    const response = await fetch(oembedUrl);
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.title) {
                            console.log('✅ Successfully fetched from oEmbed:', data.title);
                            return data.title;
                        }
                    }
                } catch (error) {
                    console.error('❌ oEmbed API failed:', error.message);
                }
                
                // 方法 3: 使用 noembed.com（第二備用）
                try {
                    const noembedUrl = `https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`;
                    console.log('🔍 Trying noembed.com...');
                    const response = await fetch(noembedUrl);
                    
                    if (response.ok) {
                        const data = await response.json();
                        if (data.title) {
                            console.log('✅ Successfully fetched from noembed:', data.title);
                            return data.title;
                        }
                    }
                } catch (error) {
                    console.error('❌ noembed failed:', error.message);
                }
                
                // 所有方法都失敗，返回預設名稱
                console.warn('⚠️ All methods failed, using default name');
                return `YouTube 影片 (${videoId})`;
            }

            function onPlayerStateChange(event) {
                // 當影片結束時自動播放下一首
                if (event.data === YT.PlayerState.ENDED) {
                    playNext();
                    stopLyricsSync();
                }
                
                // 更新播放/暫停按鈕狀態（所有設備）
                if (event.data === YT.PlayerState.PLAYING) {
                    AppState.isPlaying = true;
                    updatePlayPauseButton(true);
                    startProgressUpdate(); // 開始更新進度條
                    startMobileProgressUpdate(); // 開始更新手機版進度條
                    
                    // 更新手機版播放按鈕
                    updateMobilePlayPauseButton();
                    
                    // 添加專輯圖片動畫類別
                    const mobileControls = document.querySelector('.mobile-player-controls');
                    if (mobileControls) {
                        mobileControls.classList.add('active');
                    }
                    
                    // 開始歌詞同步
                    if (AppState.lyrics.current.length > 0) {
                        startLyricsSync();
                    }
                } else if (event.data === YT.PlayerState.PAUSED) {
                    AppState.isPlaying = false;
                    updatePlayPauseButton(false);
                    stopProgressUpdate(); // 停止更新進度條
                    stopMobileProgressUpdate(); // 停止更新手機版進度條
                    
                    // 更新手機版播放按鈕
                    updateMobilePlayPauseButton();
                    
                    // 移除專輯圖片動畫類別
                    const mobileControls = document.querySelector('.mobile-player-controls');
                    if (mobileControls) {
                        mobileControls.classList.remove('active');
                    }
                    
                    // 暫停歌詞同步
                    stopLyricsSync();
                } else if (event.data === YT.PlayerState.CUED) {
                    // 影片已載入但未播放
                    AppState.isPlaying = false;
                    updatePlayPauseButton(false);
                    stopProgressUpdate();
                    stopMobileProgressUpdate();
                    
                    // 更新手機版播放按鈕
                    updateMobilePlayPauseButton();
                    
                    // 移除專輯圖片動畫類別
                    const mobileControls = document.querySelector('.mobile-player-controls');
                    if (mobileControls) {
                        mobileControls.classList.remove('active');
                    }
                } else if (event.data === YT.PlayerState.BUFFERING) {
                    // 緩衝中，保持當前按鈕狀態
                    console.log('⏳ 影片緩衝中...');
                }
            }

            // 設置 SortableJS
            let sortableInstance = null;
            function setupSortable() {
                const queueList = AppState.domCache.get('queueList');
                
                // 銷毀舊的實例
                if (sortableInstance) {
                    sortableInstance.destroy();
                }
                
                // 創建新的 Sortable 實例
                sortableInstance = Sortable.create(queueList, {
                    animation: 200,
                    easing: "cubic-bezier(1, 0, 0, 1)",
                    ghostClass: 'sortable-ghost',
                    chosenClass: 'sortable-chosen',
                    dragClass: 'sortable-drag',
                    forceFallback: true,
                    fallbackTolerance: 3,
                    touchStartThreshold: 5,
                    delay: 50,
                    delayOnTouchOnly: true,
                    onEnd: async function(evt) {
                        const oldIndex = evt.oldIndex;
                        const newIndex = evt.newIndex;
                        
                        if (oldIndex !== newIndex) {
                            // 計算實際在 queue 中的索引
                            const actualOldIndex = AppState.currentSongIndex + 1 + oldIndex;
                            const actualNewIndex = AppState.currentSongIndex + 1 + newIndex;
                            
                            // 移動歌曲
                            const movedSong = AppState.queue.splice(actualOldIndex, 1)[0];
                            AppState.queue.splice(actualNewIndex, 0, movedSong);
                            
                            // 保存到 Firebase
                            await saveToFirebase();
                            
                            // 立即更新 UI
                            scheduleUIUpdate();
                        }
                    }
                });
            }

                    const videoId = extractVideoId(song.url);
                    const thumbnailUrl = videoId ? getThumbnailUrl(videoId) : '';
                    
                    // 判斷狀態
                    let statusClass = '';
                    let statusText = '';
                    if (index < AppState.currentSongIndex) {
                        statusClass = 'completed';
                        statusText = '✓ 已播放';
                    } else if (index === AppState.currentSongIndex) {
                        statusClass = 'playing';
                        statusText = '▶ 播放中';
                    } else {
                        statusText = '⏳ 等待中';
                    }
                    
                    return `
                        <div class="queue-item ${statusClass}">
                            <span class="queue-item-number">${index + 1}</span>

                                <div class="queue-item-thumbnail">

                            <div class="queue-item-info">

                                <p style="font-size: 0.85em; color: #666;">${statusText}</p>
                            </div>

                }).join('');

            // 添加歌曲
            async function addSong(songData, fromSearch = false, fromHistory = false) {
                AppState.queue.push(songData);
                
                // 添加到歷史記錄
                addToHistory(songData);
                
                // 如果這是第一首歌，設置當前索引並自動播放
                const isFirstSong = AppState.queue.length === 1 && AppState.currentSongIndex === -1;
                if (isFirstSong) {
                    AppState.currentSongIndex = 0;
                }
                
                // 等待 Firebase 保存完成
                await saveToFirebase();
                
                // 如果是從歷史記錄加入，只更新數字，不重新渲染列表
                if (fromHistory) {
                    // 只更新排隊數字
                    const queueCount = AppState.domCache.get('queueCount');
                    if (queueCount) {
                        queueCount.textContent = Math.max(0, AppState.queue.length - AppState.currentSongIndex - 1);
                    }
                    const allSongsCount = AppState.domCache.get('allSongsCount');
                    if (allSongsCount) {
                        allSongsCount.textContent = AppState.queue.length;
                    }
                    // 更新排隊列表和當前播放
                    updateUIComponents('current', 'next', 'queue', 'all', 'control');
                } else {
                    // 其他情況正常更新整個 UI
                    scheduleUIUpdate();
                }
                
                // 如果是第一首歌，開始播放
                if (isFirstSong) {
                    // 延遲一下確保 UI 更新完成
                    setTimeout(() => {
                        playSong(0);
                    }, 500);
                }
            }

            // 從歷史記錄重新加入
            async function readdSong(url, songName, buttonId) {
                const button = document.getElementById(buttonId);
                
                // 移除重複檢查，允許同一首歌加入多次
                // 直接更新按鈕狀態顯示已加入動畫
                button.classList.add('added');

                button.disabled = true;
                
                // 然後才加入歌曲（不會重新渲染歷史記錄）
                await addSong({
                    songName: songName,
                    url: url,
                    addedAt: new Date().toISOString()
                }, false, true); // fromSearch = false, fromHistory = true
