            // 播放指定歌曲
            async function playSong(index) {
                if (index < 0 || index >= AppState.queue.length) {
                    console.log('❌ Invalid song index:', index);
                    return;
                }
                
                console.log('🎵 playSong called with index:', index);
                AppState.currentSongIndex = index;
                const song = AppState.queue[index];
                const videoId = extractVideoId(song.url);
                
                console.log('🎵 Playing song:', song.songName, 'videoId:', videoId, 'index:', index);
                
                if (!videoId) {
                    console.error('Invalid video ID');
                    return;
                }
                
                if (!AppState.player) {
                    console.error('Player not ready');
                    return;
                }
                
                // 顯示倒數提醒 3...2...1...
                // showCountdown(); // 已移除入歌倒數提醒
                
                // 清除舊歌詞（包括完整歌詞區塊）並立即顯示載入中
                const lyricsContainer = AppState.domCache.get('lyricsContainer');
                const fullLyricsContainer = AppState.domCache.get('fullLyricsContainer');
                const lyricsSection = AppState.domCache.get('lyricsSection');
                const fullLyricsSection = AppState.domCache.get('fullLyricsSection');
                
                // 停止舊歌詞同步
                stopLyricsSync();
                AppState.lyrics.current = [];
                AppState.lyrics.currentIndex = -1;
                
                // 如果歌詞功能開啟，立即顯示載入中（避免顯示上一首的歌詞）
                if (AppState.lyrics.enabled) {
                    if (lyricsContainer) {
                        lyricsContainer.innerHTML = '<div class="lyrics-loading"><span class="loader"></span><br>正在載入歌詞...</div>';
                    }
                    if (fullLyricsContainer) {
                        fullLyricsContainer.innerHTML = '<div class="lyrics-loading"><span class="loader"></span><br>正在載入歌詞...</div>';
                    }
                    if (lyricsSection) {
                        lyricsSection.classList.add('show');
                    }
                    if (fullLyricsSection) {
                        fullLyricsSection.style.display = 'block';
                    }
                } else {
                    // 如果歌詞功能關閉，清空顯示
                    if (lyricsContainer) {
                        lyricsContainer.innerHTML = '';
                    }
                    if (fullLyricsContainer) {
                        fullLyricsContainer.innerHTML = '<div class="no-lyrics">目前沒有歌詞</div>';
                    }
                    if (fullLyricsSection) {
                        fullLyricsSection.style.display = 'none';
                    }
                }
                
                // 先靜默檢查歌詞可用性，再更新按鈕狀態
                const toggleBtn = AppState.domCache.get('toggleLyricsBtn');
                const statusText = AppState.domCache.get('lyricsStatusText');
                
                // 立即檢查歌詞可用性（不使用 setTimeout）
                checkLyricsAvailability(song.songName).then(hasLyrics => {
                    // 根據檢查結果設置按鈕狀態
                    if (toggleBtn) {
                        if (hasLyrics) {
                            toggleBtn.disabled = false;
                            toggleBtn.style.opacity = '1';
                            toggleBtn.style.cursor = 'pointer';
                        } else {
                            toggleBtn.disabled = true;
                            toggleBtn.style.opacity = '0.5';
                            toggleBtn.style.cursor = 'not-allowed';
                        }
                    }
                    if (statusText) {
                        statusText.style.display = hasLyrics ? 'none' : 'block';
                    }
                }).catch(err => {
                    console.error('檢查歌詞失敗:', err);
                    // 如果檢查失敗，啟用按鈕讓用戶可以嘗試
                    if (toggleBtn) {
                        toggleBtn.disabled = false;
                        toggleBtn.style.opacity = '1';
                        toggleBtn.style.cursor = 'pointer';
                    }
                    if (statusText) {
                        statusText.style.display = 'none';
                    }
                });
                
                // 載入影片
                try {
                    // 根據自動播放設定使用不同的方法
                    if (AppState.settings.autoplayEnabled) {
                        console.log('🎬 自動播放已開啟，使用 loadVideoById');
                        AppState.player.loadVideoById(videoId); // 載入並自動播放
                    } else {
                        console.log('⏸️ 自動播放已關閉，使用 cueVideoById');
                        AppState.player.cueVideoById(videoId); // 載入但不自動播放
                    }
                    
                    // 強制關閉字幕
                    setTimeout(() => {
                        try {
                            if (AppState.player.unloadModule) {
                                AppState.player.unloadModule('captions');
                                AppState.player.unloadModule('cc');
                            }
                        } catch (error) {
                            console.log('Could not unload captions on play:', error);
                        }
                    }, 500);
                    
                    console.log('Video loaded');
                } catch (error) {
                    console.error('Error playing video:', error);
                }
                
                // 在後台載入歌詞（如果已開啟）
                if (AppState.lyrics.enabled) {
                    console.log('🎤 歌詞功能已開啟，載入新歌曲的歌詞:', song.songName);
                    
                    // 立即載入歌詞
                    loadLyrics(song.songName).then(() => {
                        // 載入成功後，顯示完整歌詞

                            console.log('✅ 歌詞載入成功，顯示完整歌詞');
                            updateFullLyricsDisplay();
                        }
                        // ⚠️ 移除 else 區塊，loadLyrics 已經處理了沒有歌詞的情況
                    }).catch(err => {

                        // ⚠️ loadLyrics 已經處理了錯誤顯示，這裡不需要重複處理
                    });
                }
                
                await saveToFirebase();
                
                // 更新 UI 顯示當前播放歌曲
                updateUIComponents('current', 'next');
            }

            // 顯示入歌倒數提醒

                    countdownDiv.textContent = dots[index];

                    }
                };
                
                showDots();

            // 隨機排序 - 只打亂排隊中的歌曲
            async function playRandom() {
                console.log('playRandom called, queue length:', AppState.queue.length);
                if (AppState.queue.length === 0) {
                    return;
                }
                
                // 計算排隊中的歌曲數量（不包括當前和已播放的）
                const waitingQueueLength = AppState.queue.length - AppState.currentSongIndex - 1;
                
                if (waitingQueueLength <= 1) {
                    console.log('排隊中的歌曲少於 2 首，無需打亂');
                    return;
                }
                
                // 保留當前播放的歌曲和已播放的歌曲
                const playedSongs = AppState.queue.slice(0, AppState.currentSongIndex + 1);
                const waitingSongs = AppState.queue.slice(AppState.currentSongIndex + 1);
                
                // 只打亂排隊中的歌曲
                const shuffledWaiting = shuffleArray(waitingSongs);
                
                // 重建列表：已播放的歌曲 + 當前歌曲 + 打亂後的排隊歌曲
                AppState.queue = [...playedSongs, ...shuffledWaiting];
                
                await saveToFirebase();
                scheduleUIUpdate();
                console.log('排隊中的歌曲已隨機排序，當前索引:', AppState.currentSongIndex);
            }
            
            // Fisher-Yates 洗牌演算法
            function shuffleArray(array) {
                const newArray = [...array];
                for (let i = newArray.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
                }
                return newArray;
            }

            // 播放/暫停
            function togglePlayPause() {
                if (!AppState.player || !AppState.player.getPlayerState) {
                    console.log('播放器尚未準備好');
                    return;
                }
                
                const state = AppState.player.getPlayerState();
                console.log('Current player state:', state);
                
                if (state === YT.PlayerState.PLAYING) {
                    AppState.player.pauseVideo();
                    AppState.isPlaying = false;
                } else if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
                    AppState.player.playVideo();
                    AppState.isPlaying = true;
                } else {
                    // 如果沒有影片或其他狀態，嘗試播放當前歌曲
                    if (AppState.currentSongIndex >= 0 && AppState.currentSongIndex < AppState.queue.length) {
                        playSong(AppState.currentSongIndex);
                    } else {
                        console.log('沒有可播放的歌曲');
                    }
                }
                
                updatePlayPauseButton();
            }

            // 手機版播放/暫停
            function toggleMobilePlayPause() {
                if (!AppState.player || !AppState.player.getPlayerState) {
                    console.log('播放器尚未準備好');
                    return;
                }
                
                const state = AppState.player.getPlayerState();
                console.log('Mobile play/pause - Current player state:', state);
                
                if (state === YT.PlayerState.PLAYING) {
                    AppState.player.pauseVideo();
                    AppState.isPlaying = false;
                    // 同步到 Firebase：暫停
                    playerStateRef.update({
                        is_playing: false,
                        controller_device_id: AppState.lyricsSync.deviceId,
                        last_update: Date.now()
                    }).catch(err => console.error('❌ 同步播放狀態失敗:', err));
                    
                    // 移除動畫類別
                    const mobileControls = document.querySelector('.mobile-player-controls');
                    if (mobileControls) {
                        mobileControls.classList.remove('active');
                    }
                } else if (state === YT.PlayerState.PAUSED || state === YT.PlayerState.CUED) {
                    AppState.player.playVideo();
                    AppState.isPlaying = true;
                    // 同步到 Firebase：播放
                    playerStateRef.update({
                        is_playing: true,
                        controller_device_id: AppState.lyricsSync.deviceId,
                        last_update: Date.now()
                    }).catch(err => console.error('❌ 同步播放狀態失敗:', err));
                    
                    // 添加動畫類別
                    const mobileControls = document.querySelector('.mobile-player-controls');
                    if (mobileControls) {
                        mobileControls.classList.add('active');
                    }
                } else {
                    // 如果沒有影片或其他狀態，嘗試播放當前歌曲
                    if (AppState.currentSongIndex >= 0 && AppState.currentSongIndex < AppState.queue.length) {
                        playSong(AppState.currentSongIndex);
                        
                        // 添加動畫類別
                        const mobileControls = document.querySelector('.mobile-player-controls');
                        if (mobileControls) {
                            mobileControls.classList.add('active');
                        }
                    } else {
                        console.log('沒有可播放的歌曲');
                    }
                }
                
                updateMobilePlayPauseButton();
            }

            // 更新播放/暫停按鈕
            function updatePlayPauseButton() {
                const btn = AppState.domCache.get('playPauseBtn');
                if (btn) {
                    if (AppState.player && AppState.player.getPlayerState) {
                        const state = AppState.player.getPlayerState();
                        if (state === YT.PlayerState.PLAYING) {
                            btn.innerHTML = '<div style="font-size: 1.4em;">⏸️</div><div style="font-size: 0.75em; margin-top: 4px;">暫停</div>';
                        } else {
                            btn.innerHTML = '<div style="font-size: 1.4em;">▶️</div><div style="font-size: 0.75em; margin-top: 4px;">播放</div>';
                        }
                    } else {
                        btn.innerHTML = '<div style="font-size: 1.4em;">▶️</div><div style="font-size: 0.75em; margin-top: 4px;">播放</div>';
                    }
                }
            }

            // 更新手機版播放/暫停按鈕
            function updateMobilePlayPauseButton() {
                const playSvg = document.getElementById('mobilePlayIconSvg');
                const pauseSvg = document.getElementById('mobilePauseIconSvg');
                if (AppState.player && AppState.player.getPlayerState) {
                    const state = AppState.player.getPlayerState();
                    const isPlaying = state === YT.PlayerState.PLAYING;
                    if (playSvg && pauseSvg) {
                        playSvg.style.display = isPlaying ? 'none' : 'block';
                        pauseSvg.style.display = isPlaying ? 'block' : 'none';
                    }
                } else {
                    if (playSvg && pauseSvg) {
                        playSvg.style.display = 'block';
                        pauseSvg.style.display = 'none';
                    }
                }
            }

            // 初始化手機控制按鈕狀態
            function updateMobileControlButtonsState() {
                // 更新播放按鈕狀態
                updateMobilePlayPauseButton();
                
                // 根據當前播放狀態設置動畫類別
                const mobileControls = document.querySelector('.mobile-player-controls');
                if (mobileControls) {
                    if (AppState.isPlaying) {
                        mobileControls.classList.add('active');
                    } else {
                        mobileControls.classList.remove('active');
                    }
                }
            }

            // 重播當前歌曲

            // 快進10秒
            function forward() {
                if (AppState.player && AppState.player.getCurrentTime && AppState.player.seekTo) {
                    const currentTime = AppState.player.getCurrentTime();
                    AppState.player.seekTo(currentTime + 10);
                } else {
                    console.log('播放器尚未準備好');
                }
            }

            // 後退10秒
            function backward() {
                if (AppState.player && AppState.player.getCurrentTime && AppState.player.seekTo) {
                    const currentTime = AppState.player.getCurrentTime();
                    AppState.player.seekTo(Math.max(0, currentTime - 10));
                } else {
                    console.log('播放器尚未準備好');
                }
            }

            // 停止播放
            function stopVideo() {
                if (AppState.player && AppState.player.stopVideo) {
                    AppState.player.stopVideo();
                } else {
                    console.log('播放器尚未準備好');
                }
            }

            // 刪除歌曲
            async function removeSong(index) {
                const songName = AppState.queue[index]?.songName || '歌曲';
                AppState.queue.splice(index, 1);
                
                // 調整當前播放索引
                if (index < AppState.currentSongIndex) {
                    AppState.currentSongIndex--;
                } else if (index === AppState.currentSongIndex) {
                    // 如果刪除的是當前播放的歌，播放下一首
                    if (AppState.currentSongIndex >= AppState.queue.length) {
                        AppState.currentSongIndex = AppState.queue.length - 1;
                    }
                    
                    // 清除當前歌詞
                    clearLyrics();
                    
                    if (AppState.currentSongIndex >= 0) {
                        playSong(AppState.currentSongIndex);
                    } else {
                        if (AppState.player && AppState.player.stopVideo) {
                            AppState.player.stopVideo();
                        }
                    }
                }
                
                await saveToFirebase();
                
                // 立即更新 UI
                scheduleUIUpdate();
            }

            // 清空排隊列表
            async function clearQueue() {
                if (confirm('確定要清空所有排隊的歌曲嗎？（包括當前播放的歌曲）')) {
                    // 完全清空排隊列表
                    AppState.queue = [];
                    AppState.currentSongIndex = -1;
                    
                    // 停止播放器
                    if (AppState.player && AppState.player.stopVideo) {
                        AppState.player.stopVideo();
                    }
                    
                    // 停止歌詞同步並清除歌詞顯示
                    stopLyricsSync();
                    clearLyrics();
                    AppState.lyrics.current = [];
                    
                    // 保存到 Firebase
                    await saveToFirebase();
                    
                    // 立即更新 UI
                    scheduleUIUpdate();
                }
            }

            // 清除歷史記錄
            function clearHistory() {
                if (confirm('確定要清除所有歷史記錄嗎？此操作無法復原！')) {
                    AppState.history = [];
                    historyRef.set(null).then(() => {
                        // 立即更新 UI
                        scheduleUIUpdate();
                    });
                }
            }

            // Modal 控制
            const addSongModal = document.getElementById('addSongModal');
            const controlModal = document.getElementById('controlModal');
            const qrCodeModal = document.getElementById('qrCodeModal');
            const songListModal = document.getElementById('songListModal');
            const addSongBtn = document.getElementById('addSongBtn');
            const controlPanelBtn = document.getElementById('controlPanelBtn');
            const qrCodeBtn = document.getElementById('qrCodeBtn');
            const songListBtn = document.getElementById('songListBtn');
            const closeBtns = document.getElementsByClassName('close');

            addSongBtn.onclick = () => {
                addSongModal.style.display = 'block';
            };

            songListBtn.onclick = () => {
                songListModal.style.display = 'block';
                updateUI();
            };

            controlPanelBtn.onclick = () => {
                controlModal.style.display = 'block';
                updateControlPanel();
            };

            qrCodeBtn.onclick = () => {
                qrCodeModal.style.display = 'block';
            };

            // Tab 切換
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const tabName = this.getAttribute('data-tab');
                    
                    // 檢查是否是加入歌曲 Modal 的 Tab
                    if (tabName === 'url' || tabName === 'search') {
                        // 加入歌曲 Modal 的 Tab 切換
                        document.querySelectorAll('#addSongModal .tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.add-song-tab-content').forEach(c => c.classList.remove('active'));
                        
                        this.classList.add('active');
                        document.getElementById(tabName + 'TabContent').classList.add('active');
                    } else {
                        // 歌曲列表 Modal 的 Tab 切換
                        document.querySelectorAll('#songListModal .tab-btn').forEach(b => b.classList.remove('active'));
                        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                        
                        this.classList.add('active');
                        document.getElementById(tabName + 'Tab').classList.add('active');
                        
                        currentTab = tabName;
                    }
                });
            });

            // YouTube 搜尋功能 - 使用 AppState 管理狀態
            async function searchYouTube(query, pageToken = null) {
                if (!query.trim()) {
                    return;
                }

                // 如果是新搜尋（沒有 pageToken），重置頁數
                if (!pageToken) {
                    AppState.search.currentPage = 1;
                }

                AppState.search.currentQuery = query;
                const searchBtn = AppState.domCache.get('searchBtnText');
                const originalText = searchBtn.textContent;
                searchBtn.innerHTML = '<span class="loading"></span> 搜尋中...';

                try {
                    let apiUrl = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=20&q=${encodeURIComponent(query)}&type=video&key=${YOUTUBE_API_KEY}`;
                    if (pageToken) {
                        apiUrl += `&pageToken=${pageToken}`;
                    }
                    
                    const response = await fetch(apiUrl);
                    
                    if (!response.ok) {
                        throw new Error('搜尋失敗');
                    }

                    const data = await response.json();
                    AppState.search.results = data.items;
                    AppState.search.nextPageToken = data.nextPageToken || null;
                    AppState.search.prevPageToken = data.prevPageToken || null;
                    
                    displaySearchResults(data.items);
                    updatePagination();
                } catch (error) {
                    console.error('Search error:', error);
                    const searchResults = AppState.domCache.get('searchResults');
                    searchResults.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">搜尋失敗，請稍後再試</div>';
                } finally {
                    searchBtn.textContent = originalText;
                }
            }

            // 換頁
            function changePage(direction) {
                if (direction > 0 && AppState.search.nextPageToken) {
                    AppState.search.currentPage++;
                    searchYouTube(AppState.search.currentQuery, AppState.search.nextPageToken);
                } else if (direction < 0 && AppState.search.prevPageToken) {
                    AppState.search.currentPage--;
                    searchYouTube(AppState.search.currentQuery, AppState.search.prevPageToken);
                }
            }

            // 更新分頁按鈕
            function updatePagination() {
                const pagination = AppState.domCache.get('pagination');
                const prevBtn = AppState.domCache.get('prevPageBtn');
                const nextBtn = AppState.domCache.get('nextPageBtn');
                const pageInfo = AppState.domCache.get('pageInfo');

                if (AppState.search.results.length > 0) {
                    pagination.style.display = 'flex';
                    prevBtn.disabled = !AppState.search.prevPageToken;
                    nextBtn.disabled = !AppState.search.nextPageToken;
                    pageInfo.textContent = `第 ${AppState.search.currentPage} 頁`;
                } else {
                    pagination.style.display = 'none';
                }
            }

            // 顯示搜尋結果
            function displaySearchResults(items) {
                const searchResults = AppState.domCache.get('searchResults');
                
                if (!items || items.length === 0) {
                    searchResults.innerHTML = '<div style="text-align: center; padding: 40px; color: #999;">沒有找到相關影片</div>';
                    const pagination = AppState.domCache.get('pagination');
                    pagination.style.display = 'none';
                    return;
                }

                searchResults.innerHTML = items.map(item => {
                    const videoId = item.id.videoId;
                    const title = item.snippet.title.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
                    const channelTitle = item.snippet.channelTitle.replace(/'/g, "&apos;").replace(/"/g, "&quot;");
                    const thumbnailUrl = item.snippet.thumbnails.medium.url;
                    const videoUrl = `https://www.youtube.com/watch?v=${videoId}`;
                    
                    // 移除「已存在」檢查，允許同一首歌加入多次
                    const buttonHTML = `<button class="search-result-add-btn" data-video-id="${videoId}" data-video-url="${videoUrl}" data-video-title="${title}">➕ 加入</button>`;

                    return `
                        <div class="search-result-item">
                            <div class="search-result-thumbnail" data-video-url="${videoUrl}" style="cursor: pointer;">
                                <img src="${thumbnailUrl}" alt="${title}">
                            </div>
                            <div class="search-result-info">
                                <h4>${title}</h4>
                                <p>${channelTitle}</p>
                            </div>
                            ${buttonHTML}
                        </div>
                    `;
                }).join('');
                
                // 為縮圖添加點擊事件 - 在 YouTube 預覽
                document.querySelectorAll('.search-result-thumbnail').forEach(thumbnail => {
                    thumbnail.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const url = this.getAttribute('data-video-url');
                        if (url) {
                            // 使用 <a> 標籤模擬點擊，更可靠
                            const link = document.createElement('a');
                            link.href = url;
                            link.target = '_blank';
                            link.rel = 'noopener noreferrer';
                            document.body.appendChild(link);
                            link.click();
                            document.body.removeChild(link);
                        }
                    });
                });
                
                // 為每個按鈕添加事件監聽器
                document.querySelectorAll('.search-result-add-btn').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        e.stopPropagation();
                        const url = this.getAttribute('data-video-url');
                        const title = this.getAttribute('data-video-title');
                        addSongFromSearch(url, title, this);
                    });
                });
            }

            // 從搜尋結果加入歌曲
            async function addSongFromSearch(url, title, button) {
                try {
                    // 檢查是否已經在隊列中
                    const videoId = extractVideoId(url);
                    
                    // 更新按鈕狀態為載入中
                    const originalHTML = button.innerHTML;
                    button.innerHTML = '<span class="loading"></span>';
                    button.disabled = true;
                    
                    // 等待歌曲添加完成
                    await addSong({
                        songName: title,
                        url: url,
                        addedAt: new Date().toISOString()
                    }, true); // 傳遞 fromSearch = true

                    // 成功動畫
                    button.classList.add('added');
                    button.innerHTML = '✓ 已加入';
                    button.style.background = 'linear-gradient(135deg, #10b981 0%, #059669 100%)';
                    
                    console.log('✅ 歌曲已成功從搜尋結果加入:', title);
                    
                    // 添加成功的視覺反饋
                    setTimeout(() => {
                        button.classList.remove('added');
                    }, 600);
                } catch (error) {
                    console.error('❌ 加入歌曲失敗:', error);
                    button.innerHTML = '❌ 失敗';
                    button.style.background = 'linear-gradient(135deg, #ef4444 0%, #dc2626 100%)';
                    
                    // 3秒後恢復按鈕
                    setTimeout(() => {
                        button.innerHTML = '➕ 加入';
                        button.style.background = '';
                        button.disabled = false;
                    }, 3000);
                }
            }

            // 搜尋按鈕點擊事件
            document.getElementById('searchBtn').onclick = () => {
                const query = document.getElementById('searchInput').value;
                searchYouTube(query);
            };

            // 搜尋輸入框按 Enter 鍵
            document.getElementById('searchInput').onkeypress = (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const query = document.getElementById('searchInput').value;
                    searchYouTube(query);
                }
            };

            // 密碼驗證（已移除）

            // 關閉 modal
            Array.from(closeBtns).forEach(btn => {
                btn.onclick = function() {
                    const modal = this.parentElement.parentElement;
                    modal.style.display = 'none';
                };
            });

            window.onclick = (event) => {
                if (event.target === addSongModal) {
                    addSongModal.style.display = 'none';
                }
                if (event.target === controlModal) {
                    controlModal.style.display = 'none';
                }
                if (event.target === qrCodeModal) {
                    qrCodeModal.style.display = 'none';
                }
                if (event.target === songListModal) {
                    songListModal.style.display = 'none';
                }
            };

            // 表單提交
            document.getElementById('addSongForm').onsubmit = async (e) => {
                e.preventDefault();
                
                const youtubeUrl = document.getElementById('youtubeUrl').value.trim();
                const submitBtn = document.getElementById('addBtnText');
                const originalText = submitBtn.textContent;
                
                // 驗證 URL
                const videoId = extractVideoId(youtubeUrl);
                if (!videoId) {
                    alert('請輸入有效的 YouTube 連結');
                    return;
                }
                
                console.log('Adding song with video ID:', videoId);
                
                // 自動獲取歌曲名稱
                submitBtn.innerHTML = '<span class="loading"></span> 正在獲取歌曲資訊...';
                
                let songName;
                try {
                    console.log('Calling getVideoTitle...');
                    songName = await getVideoTitle(videoId);
                    console.log('Got song name:', songName);
                    
                    // 如果獲取失敗（返回預設名稱），提示用戶
                    if (songName.startsWith('YouTube 影片')) {
                        alert('無法獲取影片資訊，請確認連結是否正確');
                        submitBtn.textContent = originalText;
                        return;
                    }
                } catch (error) {
                    console.error('Error fetching title:', error);
                    alert('獲取影片資訊失敗，請稍後再試');
                    submitBtn.textContent = originalText;
                    return;
                }
                
                try {
                    submitBtn.innerHTML = '<span class="loading"></span> 正在加入歌曲...';
                    
                    // 等待歌曲添加完成
                    await addSong({
                        songName,
                        url: youtubeUrl,
                        addedAt: new Date().toISOString()
                    });
                    
                    console.log('✅ 歌曲已成功加入:', songName);
                    
                    // 清空表單
                    e.target.reset();
                    addSongModal.style.display = 'none';
                } catch (error) {
                    console.error('Error adding song:', error);
                    alert('加入歌曲失敗，請稍後再試');
                } finally {
                    submitBtn.textContent = originalText;
                }
            };

            // 初始化
            document.addEventListener('DOMContentLoaded', () => {
                console.log('KTV System initialized');
                // 立即設置 Firebase 監聽器，不等待 YouTube Player
                setupFirebaseListeners();

                // 視窗尺寸變更時，保證手機控制列在桌面隱藏
                function updateMobileControlsVisibilityBySize() {
                    const el = document.querySelector('.mobile-player-controls');
                    if (!el) return;
                    if (window.innerWidth > 768) {
                        el.style.display = 'none';
                    } else {
                        el.style.display = '';
                    }
                }
                window.addEventListener('resize', updateMobileControlsVisibilityBySize);
                // 初次呼叫一次
                updateMobileControlsVisibilityBySize();
                
                // 控制面板按鈕
                const prevBtn = AppState.domCache.get('prevBtn');
                const nextBtn = AppState.domCache.get('nextBtn');
                const randomBtn = AppState.domCache.get('randomBtn');
                const clearQueueBtn = AppState.domCache.get('clearQueueBtn');
                const clearHistoryBtn = AppState.domCache.get('clearHistoryBtn');
                
                console.log('Control panel buttons:', {
                    prevBtn: !!prevBtn,
                    nextBtn: !!nextBtn,
                    randomBtn: !!randomBtn,
                    clearQueueBtn: !!clearQueueBtn,
                    clearHistoryBtn: !!clearHistoryBtn
                });
                
                if (prevBtn) prevBtn.onclick = playPrevious;
                if (nextBtn) nextBtn.onclick = playNext;
                if (randomBtn) randomBtn.onclick = playRandom;
                if (clearQueueBtn) clearQueueBtn.onclick = clearQueue;
                if (clearHistoryBtn) clearHistoryBtn.onclick = clearHistory;

                // 現正播放控制按鈕
                const controlPrevBtn = document.getElementById('controlPrevBtn');
                const controlNextBtn = document.getElementById('controlNextBtn');
                const controlPlayPauseBtn = document.getElementById('controlPlayPauseBtn');
                const controlVolumeBtn = document.getElementById('controlVolumeBtn');
                
                if (controlPrevBtn) controlPrevBtn.onclick = playPrevious;
                if (controlNextBtn) controlNextBtn.onclick = playNext;
                if (controlPlayPauseBtn) controlPlayPauseBtn.onclick = togglePlayPause;
                if (controlVolumeBtn) controlVolumeBtn.onclick = toggleVolumeControl;

                // 音量滑桿
                const volumeSlider = document.getElementById('volumeSlider');
                if (volumeSlider) {
                    volumeSlider.oninput = (e) => setVolume(e.target.value);
                }

                // 進度條點擊
                const progressBar = document.getElementById('progressBar');
                if (progressBar) {
                    progressBar.onclick = seekTo;
                }

                // 手機版控制按鈕
                const mobilePrevBtn = document.getElementById('mobilePrevBtn');
                const mobileNextBtn = document.getElementById('mobileNextBtn');
                const mobilePlayPauseBtn = document.getElementById('mobilePlayPauseBtn');
                const mobileVolumeBtn = document.getElementById('mobileVolumeBtn');
                const mobileVolumeSlider = document.getElementById('mobileVolumeSlider');
                
                if (mobilePrevBtn) mobilePrevBtn.onclick = playPrevious;
                if (mobileNextBtn) mobileNextBtn.onclick = playNext;
                if (mobilePlayPauseBtn) mobilePlayPauseBtn.onclick = toggleMobilePlayPause;
                if (mobileVolumeBtn) mobileVolumeBtn.onclick = toggleMobileVolume;
                if (mobileVolumeSlider) mobileVolumeSlider.oninput = (e) => setVolume(e.target.value);

                // 假全螢幕按鈕
                AppState.domCache.get('fakeFullscreenBtn').onclick = toggleFakeFullscreen;
                
                // 全螢幕關閉按鈕
                const fullscreenCloseBtn = document.getElementById('fullscreenCloseBtn');
                if (fullscreenCloseBtn) {
                    fullscreenCloseBtn.onclick = toggleFakeFullscreen;
                }
                
                // 主要裝置按鈕
                const masterDeviceBtn = document.getElementById('masterDeviceBtn');
                if (masterDeviceBtn) {
                    masterDeviceBtn.onclick = setAsMasterDevice;
                    updateMasterDeviceButton();
                }
                
                // 重置主裝置按鈕
                const resetMasterDeviceBtn = document.getElementById('resetMasterDeviceBtn');
                if (resetMasterDeviceBtn) {
                    resetMasterDeviceBtn.onclick = resetAllMasterDevices;
                }

                // 自動播放開關按鈕
                const toggleAutoplayBtn = AppState.domCache.get('toggleAutoplayBtn');
                if (toggleAutoplayBtn) {
                    toggleAutoplayBtn.onclick = toggleAutoplay;
                    // 初始化按鈕狀態
                    if (AppState.settings.autoplayEnabled) {
                        toggleAutoplayBtn.classList.add('active');
                    }
                    console.log('🎬 自動播放初始設定:', AppState.settings.autoplayEnabled ? '開啟' : '關閉');
                }

                // 歌詞開關按鈕
                AppState.domCache.get('toggleLyricsBtn').onclick = toggleLyrics;
                
                // 🔥 初始化手機控制按鈕狀態
                updateMobileControlButtonsState();
                
                // 搜尋按鈕點擊事件
                AppState.domCache.get('searchBtn').onclick = () => {
                    const query = AppState.domCache.get('searchInput').value;
                    searchYouTube(query);
                };

                // 搜尋輸入框按 Enter 鍵
                AppState.domCache.get('searchInput').onkeypress = (e) => {
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        const query = AppState.domCache.get('searchInput').value;
                        searchYouTube(query);
                    }
                };
            });
        </script>
    </body>
    </html>
